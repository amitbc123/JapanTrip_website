<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1626">
<title>מפת האוצר - יפן 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app. Sea-navy ground, straw-hat gold accent, Luffy red for One Piece.
   Header with live clock + region rail, sticky search/filters, card list or radar, bottom tab bar. */
:root{
  --sea:#0B1626; --sea-2:#11213A; --card:#15294A; --card-2:#1B3360; --line:#26406B;
  --ink:#EEF3FB; --muted:#9DB0CF; --dim:#6F86AB;
  --gold:#F5C443; --gold-ink:#1A1405; --red:#E4572E; --ok:#5ED39A; --warn:#FFB454; --bad:#FF6B6B;
  --f:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.en{direction:ltr;unicode-bidi:isolate;display:block;text-align:right}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Header ---------- */
.hdr{position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px);background:
  radial-gradient(120% 90% at 100% 0%,#1E3E73 0%,transparent 60%),
  radial-gradient(90% 70% at 0% 100%,#3B1F3A 0%,transparent 60%),var(--sea)}
.hdr::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-radial-gradient(circle at 85% -20%,transparent 0 22px,rgba(255,255,255,.07) 22px 23px)}
.hdr-in{position:relative;z-index:1;padding-block:16px 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(245,196,67,.6)}
.brand .logo svg{width:26px;height:26px;stroke-width:2}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.clock{text-align:left;direction:ltr}
.clock b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock span{font-size:12px;color:var(--muted)}
.now{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.now .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px 10px;color:var(--ink)}
.now .pill.loc{border-color:rgba(94,211,154,.5)}
.now .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(94,211,154,.2)}
.now button.pill{cursor:pointer}

.rail{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.reg{flex:0 0 auto;width:148px;height:104px;border-radius:18px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden;text-align:right;padding:11px 13px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between}
.reg .kanji{position:absolute;left:-6px;bottom:-22px;font-size:76px;font-weight:800;line-height:1;color:rgba(255,255,255,.06);pointer-events:none;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.reg b{font-size:18px;font-weight:700;line-height:1.15}
.reg .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.reg .n{font-size:12px;color:var(--muted)}
.reg .badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--gold);color:var(--gold-ink)}
.reg .badge.past{background:rgba(255,255,255,.12);color:var(--muted)}
.reg[aria-pressed="true"]{background:linear-gradient(160deg,#2A4D8F,#1A3263);border-color:var(--gold);box-shadow:0 10px 26px -14px rgba(245,196,67,.7)}
.reg.isPast{opacity:.55}

/* ---------- Toolbar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,22,38,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06);padding-top:env(safe-area-inset-top,0px)}
.bar-in{padding-block:10px;display:flex;flex-direction:column;gap:9px}
.srow{display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 40px 11px 12px;font-size:15.5px}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--dim)}
.ibtn{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative}
.ibtn.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.ibtn .cnt{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 11px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c,#888)}
.chip[aria-pressed="true"]{background:var(--c,var(--gold));border-color:var(--c,var(--gold));color:#0B1626;font-weight:700}
.chip[aria-pressed="true"] .sw{background:#0B1626}
.chip.tog[aria-pressed="true"]{--c:var(--gold)}
.chip small{opacity:.7;font-weight:500}

/* ---------- Content ---------- */
main{padding-block:14px 30px;display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:2px 2px 0}
.sec-h h2{margin:0;font-size:19px;font-weight:700}
.sec-h span{font-size:13px;color:var(--muted)}
.base{display:flex;align-items:center;gap:10px;background:var(--sea-2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:13.5px}
.base .ic{width:34px;height:34px;border-radius:10px;background:rgba(245,196,67,.14);color:var(--gold);display:grid;place-items:center;flex:none}
.base .tx{flex:1;min-width:0}
.base .tx b{display:block;font-size:14px}
.base .tx span{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.areas{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.areas::-webkit-scrollbar{display:none}
.areas .chip{flex:none}
.areas .chip{font-size:12.5px;padding:5px 11px}
.access{font-size:13px;color:var(--muted);background:var(--sea-2);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
.access svg{color:var(--gold);margin-top:2px}

/* Suggestions strip */
.sugg{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.sugg::-webkit-scrollbar{display:none}
.sc{flex:0 0 auto;width:220px;border-radius:16px;padding:12px 13px;background:linear-gradient(155deg,var(--c2,#1B3360),var(--card));border:1px solid var(--line);text-align:right;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.sc .k{font-size:11.5px;font-weight:700;color:var(--c,var(--gold));letter-spacing:.03em}
.sc b{font-size:15px;line-height:1.25}
.sc .m{font-size:12.5px;color:var(--muted)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.card.must{border-color:rgba(245,196,67,.45)}
.card.visited{opacity:.62}
.c-main{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:13px 13px 12px;text-align:right;width:100%;background:none;border:0}
.tile{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);position:relative}
.tile svg{width:25px;height:25px}
.tile .hs{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-size:10px;font-weight:800;border-radius:6px;padding:0 5px;white-space:nowrap}
.c-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.c-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--muted)}
.c-tags .cat{color:var(--c)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:1px 7px;font-size:11px;font-weight:700}
.tag.must{background:var(--gold);color:var(--gold-ink)}
.tag.amit{background:rgba(94,211,154,.16);color:var(--ok)}
.tag.sea{background:rgba(255,107,107,.14);color:var(--bad)}
.tag.d0{background:rgba(94,211,154,.16);color:var(--ok)}
.tag.d1{background:rgba(255,180,84,.16);color:var(--warn)}
.tag.d2{background:rgba(255,107,107,.14);color:var(--bad)}
.c-name{font-size:16.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.c-he{font-size:13.5px;color:var(--muted)}
.c-desc{font-size:14px;color:#D3DDEE;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .c-desc{display:block;-webkit-line-clamp:unset}
.c-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.mt{display:inline-flex;align-items:center;gap:5px;background:var(--sea-2);border-radius:9px;padding:3px 8px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mt svg{width:14px;height:14px;color:var(--muted)}
.mt.far{color:var(--muted)}
.c-more{padding:0 13px 13px;display:flex;flex-direction:column;gap:10px}
.tip{font-size:13.5px;background:rgba(245,196,67,.08);border-right:3px solid var(--gold);border-radius:8px;padding:8px 10px;color:#F1E3B8}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ab{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sea-2);border-radius:12px;padding:9px 6px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);min-width:0}
.ab.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ab.on{background:rgba(94,211,154,.18);border-color:var(--ok);color:var(--ok)}
.ab.fav.on{background:rgba(245,196,67,.18);border-color:var(--gold);color:var(--gold)}
.qa{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.qa button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:rgba(11,22,38,.6);display:grid;place-items:center;color:var(--muted)}
.qa button.on{color:var(--gold);border-color:var(--gold)}
.qa button.pl.on{color:var(--ok);border-color:var(--ok)}
.c-main{padding-left:92px}
.empty{text-align:center;color:var(--muted);padding:30px 14px;border:1.5px dashed var(--line);border-radius:var(--r)}
.more-btn{align-self:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 18px;font-weight:600}

/* Radar */
.radar{background:radial-gradient(circle at 50% 50%,#13294B,#0B1626 75%);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:relative}
.radar > svg{width:100%;height:auto;display:block}
.radar .lg svg.i{width:14px;height:14px;vertical-align:-2px}
.radar .lg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 6px}
.rpop{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.rpop .tx{flex:1;min-width:0}
.rpop b{display:block;font-size:14.5px}
.rpop span{font-size:12.5px;color:var(--muted)}

/* Sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(3,8,16,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:86vh;overflow-y:auto;background:var(--sea-2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s ease}
.sheet.show{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 12px;font-size:19px}
.fgrp{margin-bottom:16px}
.fgrp > b{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.fgrp .chips{flex-wrap:wrap}
.chip.grp{padding:7px 14px 7px 12px;font-size:14px}
.chip.grp svg.i{width:16px;height:16px}
.chip.grp[aria-pressed="true"] svg.i{color:#0B1626}
.subs{padding:8px 10px;margin-top:-2px;background:var(--sea-2);border:1px solid var(--line);border-radius:14px}
.subs .lbl{flex:none;align-self:center;font-size:12px;color:var(--muted);font-weight:600;padding-left:4px}
.subs .chip{font-size:12.5px;padding:4px 10px;background:var(--card)}
.subs .chip[aria-pressed="true"]{background:var(--c,var(--gold))}
.sheet .row{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14.5px;text-decoration:none}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.block{width:100%}

/* Planner */
.pl-head{display:flex;gap:8px;align-items:center}
.pl-head select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.leg{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.leg .num{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.leg .tx{min-width:0}
.leg .tx b{display:block;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.leg .tx span{font-size:12.5px;color:var(--muted)}
.leg .ops{display:flex;gap:4px}
.leg .ops button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--sea-2);display:grid;place-items:center;color:var(--muted)}
.hop{font-size:12px;color:var(--dim);padding:0 48px 0 0;display:flex;align-items:center;gap:6px}
.hop svg{width:13px;height:13px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.summary b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}

/* Cards tab */
.allergy img{width:100%;border-radius:14px;display:block;background:#fff}
.phr{display:flex;flex-direction:column;gap:8px}
.ph{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ph .jp{font-size:21px;font-weight:700;direction:ltr;text-align:right;line-height:1.35}
.ph .ro{font-size:13px;color:var(--gold);direction:ltr;text-align:right}
.ph .he{font-size:13.5px;color:var(--muted)}
.big{position:fixed;inset:0;z-index:60;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px}
.big img{max-width:100%;max-height:100%}
.big .jpbig{color:#111;font-size:min(9vw,46px);font-weight:800;line-height:1.5;text-align:center;direction:ltr;padding:20px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(17,33,58,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--dim);position:relative}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-selected="true"]{color:var(--gold)}
.tabs button .cnt{position:absolute;top:5px;left:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--gold-ink);font-weight:700;border-radius:12px;padding:9px 16px;font-size:14px;z-index:70;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{font-size:12px;color:var(--dim);text-align:center;padding:8px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15.5c0-1.4 4-2.5 9-2.5s9 1.1 9 2.5-4 2.5-9 2.5-9-1.1-9-2.5z"/><path d="M7 14V11a5 5 0 0 1 10 0v3"/><path d="M7 12.6c1.5.6 3.2.9 5 .9s3.5-.3 5-.9" stroke="#E4572E" stroke-width="2.4"/></svg></div>
        <div><h1>מפת האוצר</h1><small>המדריך שלנו ליפן · 2026</small></div>
      </div>
      <div class="clock"><b id="clk">--:--</b><span id="clkd"></span></div>
    </div>
    <div class="now" id="nowline"></div>
    <div class="rail" id="rail" role="tablist" aria-label="ערים"></div>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap bar-in">
    <div class="srow">
      <label class="search"><input id="q" type="search" placeholder="חיפוש: ראמן, One Piece, מקדש..." autocomplete="off"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label>
      <button class="ibtn" id="viewBtn" aria-label="תצוגת רדאר"></button>
      <button class="ibtn" id="fltBtn" aria-label="מסננים"></button>
    </div>
    <div class="chips" id="cats"></div>
    <div class="chips subs" id="subs" hidden></div>
  </div>
</div>

<div class="wrap">
  <main id="view-explore"></main>
  <main id="view-plan" hidden></main>
  <main id="view-saved" hidden></main>
  <main id="view-cards" hidden></main>
</div>

<nav class="tabs"><div class="in" role="tablist">
  <button data-tab="explore" aria-selected="true"></button>
  <button data-tab="plan" aria-selected="false"></button>
  <button data-tab="saved" aria-selected="false"></button>
  <button data-tab="cards" aria-selected="false"></button>

function now(){
  const p = {}; new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);

}
const addDays = (d,n)=>{ const t=new Date(d+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
const fmtD = (d,o)=> new Intl.DateTimeFormat("he-IL",{timeZone:"UTC",...o}).format(new Date(d+"T00:00:00Z"));
const dShort = d => fmtD(d,{day:"numeric",month:"numeric"});
const dLong = d => fmtD(d,{weekday:"long",day:"numeric",month:"long"});
function km(a,b,c,d){ const R=6371,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,s=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function bearing(a,b,c,d){ const t=Math.PI/180; const y=Math.sin((d-b)*t)*Math.cos(c*t), x=Math.cos(a*t)*Math.sin(c*t)-Math.sin(a*t)*Math.cos(c*t)*Math.cos((d-b)*t); return Math.atan2(y,x); }
function walkMin(k){ return Math.round(k*1.25/4.8*60); }
function transitMin(k){ return k<=25 ? Math.round(8 + k*1.35/20*60) : Math.round(15 + k/50*60); }
function fmtMin(m){ if (m < 60) return m + " דק׳"; const h=Math.floor(m/60), r=m%60; return r ? `${h}:${String(r).padStart(2,"0")} ש׳` : `${h} ש׳`; }
function fmtKm(k){ return k < 1 ? Math.round(k*1000/10)*10 + " מ׳" : (k<10 ? k.toFixed(1) : Math.round(k)) + " ק״מ"; }

let GEO = null; // {lat,lon,acc,t}
function regionForDate(d){ return REGIONS.find(r => d >= r.from && d < r.to) || (d >= "2026-12-06" ? REGIONS[5] : REGIONS[0]); }
function baseForDate(r, d){ return r.bases.find(b => d >= b.from && d < b.to) || r.bases[r.bases.length-1]; }
function regionNearGeo(){ if (!GEO) return null; let best=null,bd=1e9; REGIONS.forEach(r=>r.bases.forEach(b=>{ const k=km(GEO.lat,GEO.lon,b.lat,b.lon); if(k<bd){bd=k;best=r;} })); return bd < 90 ? best : null; }
function curRegion(){ return REGIONS.find(r => r.k === ST.reg) || regionForDate(now().date); }
function curBase(){ const r = curRegion(); const k = ST.base[r.k]; return r.bases.find(b=>b.k===k) || baseForDate(r, now().date); }
/* origin = live location if inside the region, else the hotel */
function origin(){

  if (ST.useLoc && GEO && r.bases.some(x => km(GEO.lat,GEO.lon,x.lat,x.lon) < 60)) return { lat:GEO.lat, lon:GEO.lon, he:"המיקום שלך", me:true };
  return { lat:b.lat, lon:b.lon, he:b.he, me:false };
}

function parseLatLon(s){
  s = (s || "").trim();
  /* degrees-minutes-seconds, e.g. 35°41'37.6"N 139°42'12.3"E */
  const dms = /(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)?["″]?\s*([NS])[,\s]+(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)?["″]?\s*([EW])/i.exec(s);
  if (dms) {
    const v = (d, m2, sec, h) => (+d + +m2/60 + (+sec||0)/3600) * (/[SW]/i.test(h) ? -1 : 1);
    return { lat: v(dms[1],dms[2],dms[3],dms[4]), lon: v(dms[5],dms[6],dms[7],dms[8]) };
  }
  const m = /@(-?\d+\.\d+),\s*(-?\d+\.\d+)/.exec(s) || /[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/.exec(s) || /(-?\d{1,3}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)/.exec(s);
  if (!m) return null; const lat = +m[1], lon = +m[2];
  return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? { lat, lon } : null;
}

function filtered(){
  const r = curRegion(), o = origin(), q = $("#q").value.trim().toLowerCase(), sel = new Set(grpCats()), area = ST.area[r.k] || "";
  let list = PL.filter(p => p.reg === r.k);
  if (area) list = list.filter(p => p.area === area);
  if (sel.size) list = list.filter(p => p.cats.some(c => sel.has(c)));
  if (q) list = list.filter(p => (p.en+" "+p.he+" "+p.desc+" "+p.tip+" "+p.cats.map(c=>CATS[c]?.he).join(" ")).toLowerCase().includes(q));
  const t = ST.tog;
  if (t.must) list = list.filter(p => p.must);
  if (t.amit) list = list.filter(p => !isFood(p) || (p.amit && !p.sea));
  if (t.omri) list = list.filter(p => !isFood(p) || p.dairy === 0 || p.dairy === 1);
  if (t.near) list = list.filter(p => distOf(p,o) <= 1.6);
  if (t.mid) list = list.filter(p => distOf(p,o) <= 8);
  if (t.hidevis) list = list.filter(p => !ST.vis[p.id]);
  list.forEach(p => p._d = distOf(p, o));
  if (ST.sort === "dist") list.sort((a,b) => a._d - b._d);
  else if (ST.sort === "must") list.sort((a,b) => (b.must - a.must) || ((b.hs||0)-(a.hs||0)) || a._d - b._d);
  else if (ST.sort === "hs") list.sort((a,b) => (b.hs||0)-(a.hs||0) || a._d - b._d);
  else list.sort((a,b) => a.en.localeCompare(b.en));
  return list;
}

function radar(list, o){
  const S = 360, C = S/2, R = C - 18;

  });
  svg += `<circle cx="${C}" cy="${C}" r="8" fill="#F5C443" stroke="#0B1626" stroke-width="2"/></svg>`;
  const s = RSEL && BYID[RSEL];
  const pop = s ? `<div class="rpop" style="--c:${CATS[s.cats[0]].c}"><span class="tile" style="width:42px;height:42px;border-radius:12px">${ic(CATS[s.cats[0]].i)}</span><span class="tx"><b class="en">${esc(s.en)}</b><span>${esc(s.he)} · ${fmtKm(distOf(s,o))}</span></span><button class="ab pri" data-jump="${s.id}">פרטים</button></div>` : "";

}

/* ================= Planner ================= */
function tripDates(){ const out=[]; for(let d=now().date < "2026-11-03" ? "2026-11-03" : now().date; d<="2026-12-06"; d=addDays(d,1)) out.push(d); return out; }
let PLAN_DATE = null;
function planDate(){ const ds = tripDates(); if (!PLAN_DATE || !ds.includes(PLAN_DATE)) PLAN_DATE = ds[0]; return PLAN_DATE; }
function planOrigin(d){ const r = regionForDate(d), b = baseForDate(r, d); return { lat:b.lat, lon:b.lon, he:b.he, r }; }
function nn(ids, o){ const rest = ids.map(i=>BYID[i]).filter(Boolean), out=[]; let cur=o; while(rest.length){ let bi=0,bd=1e9; rest.forEach((p,i)=>{const d=km(cur.lat,cur.lon,p.lat,p.lon); if(d<bd){bd=d;bi=i;}}); const p=rest.splice(bi,1)[0]; out.push(p.id); cur=p; } return out; }
function renderPlan(){
  const d = planDate(), o = planOrigin(d), ids = (ST.plans[d] || []).filter(i => BYID[i]), el = $("#view-plan");

    <div class="pl-head"><select id="pdate" aria-label="בחר יום">${tripDates().map(x=>`<option value="${x}" ${x===d?"selected":""}>${dLong(x)} · ${regionForDate(x).he}</option>`).join("")}</select></div>
    <div class="base"><span class="ic">${ic("bed")}</span><span class="tx"><b dir="ltr" style="text-align:right">${esc(o.he)}</b><span>יוצאים מהמלון ב${o.r.he}</span></span></div>`;
  if (!ids.length) {
    h += `<div class="empty">אין עדיין מקומות ליום הזה.<br>לחצו על ＋ בכרטיס של מקום, או תנו לי לבנות יום אוטומטית.</div>`;

    ids.forEach((id, i) => { const p = BYID[id], k = km(cur.lat,cur.lon,p.lat,p.lon); tot += k;
      legs += `<div class="hop">${ic(k<=2?"walk":"train")}${fmtKm(k)} · ${k<=2?fmtMin(walkMin(k))+" הליכה":fmtMin(transitMin(k))+" בתחבורה"}</div>`;
      legs += `<div class="leg" style="--c:${CATS[p.cats[0]].c}"><span class="num">${i+1}</span><span class="tx"><b class="en">${esc(p.en)}</b><span>${esc(p.he)}</span></span><span class="ops"><button data-mv="${id}|-1" aria-label="למעלה">${ic("up")}</button><button data-mv="${id}|1" aria-label="למטה">${ic("down")}</button><button data-rm="${id}" aria-label="הסר">${ic("x")}</button></span></div>`;
      cur = p; });
    const pts = ids.map(i => BYID[i]);
    h += `<div class="summary"><div><b>${ids.length}</b><span>עצירות</span></div><div><b>${fmtKm(tot)}</b><span>סה״כ בקו ישר</span></div><div><b>${fmtMin(Math.round(tot<=6?walkMin(tot):transitMin(tot)))}</b><span>זמן תנועה משוער</span></div></div>`;
    h += planMap(o, pts);
    h += `<div class="sec-h"><h2 style="font-size:16px">כל היום ב-Google Maps</h2><span>${routeLinks(o, pts).length > 1 ? "מחולק לחלקים, לפתוח לפי הסדר" : "קישור אחד"}</span></div>`;
    h += `<div style="display:flex;flex-direction:column;gap:8px">${routeLinks(o, pts).map((L,i,a)=>`<a class="btn ${i===0?"pri":""} block" href="${L.url}" target="_blank" rel="noopener">${ic("nav")}${a.length>1?`חלק ${i+1}: עצירות ${L.from}-${L.to}`:"פתח את כל המסלול"}</a>`).join("")}</div>`;
    h += `<div class="list" style="gap:6px">${legs}</div>`;
    h += `<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-opt="1">${ic("route")}סדר מסלול קצר</button><button class="btn" data-copyplan="1">${ic("copy")}העתק לוואטסאפ</button><button class="btn" data-clear="1">${ic("x")}נקה</button></div>`;
  }
  h += `<button class="btn pri block" data-auto="1">${ic("wand")}בנה לי יום לפי עניין ומרחק</button>`;
  el.innerHTML = h;
}
/* Google Maps mobile accepts at most 3 waypoints per link, so chain links of up to 4 stops */
function routeLinks(o, pts){
  const q = p => encodeURIComponent(p.en + ", " + cityEn(p)), out = [];
  let start = `${o.lat},${o.lon}`, i = 0;
  while (i < pts.length) {
    const chunk = pts.slice(i, i + 4), dest = chunk[chunk.length - 1], wps = chunk.slice(0, -1).map(q).join("|");
    const mode = chunk.every((p, j) => { const prev = j ? chunk[j-1] : (i ? pts[i-1] : o); return km(prev.lat,prev.lon,p.lat,p.lon) <= 2.2; }) ? "walking" : "transit";
    out.push({ from: i + 1, to: i + chunk.length, url: `https://www.google.com/maps/dir/?api=1&origin=${start}&destination=${q(dest)}${wps ? "&waypoints=" + wps : ""}&travelmode=${wps && mode === "transit" ? "driving" : mode}` });
    start = q(dest); i += 4;
  }

}
function planMap(o, pts){
  const all = [o, ...pts], W = 360, H = 240, pad = 26;
  let la0 = Math.min(...all.map(p=>p.lat)), la1 = Math.max(...all.map(p=>p.lat)), lo0 = Math.min(...all.map(p=>p.lon)), lo1 = Math.max(...all.map(p=>p.lon));
  const kx = Math.cos(((la0+la1)/2)*Math.PI/180);
  let sx = (lo1-lo0)*kx || 0.01, sy = (la1-la0) || 0.01; const s = Math.min((W-2*pad)/sx, (H-2*pad)/sy);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="מפת התוכנית">`;
  svg += `<polyline points="${all.map(p=>X(p).toFixed(1)+","+Y(p).toFixed(1)).join(" ")}" fill="none" stroke="#F5C443" stroke-width="2.2" stroke-dasharray="6 5" stroke-linejoin="round" opacity=".8"/>`;
  svg += `<rect x="${(X(o)-9).toFixed(1)}" y="${(Y(o)-9).toFixed(1)}" width="18" height="18" rx="5" fill="#F5C443" stroke="#0B1626" stroke-width="2"/>`;
  pts.forEach((p,i) => { const c = CATS[p.cats[0]].c; svg += `<circle cx="${X(p).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="11" fill="${c}" stroke="#0B1626" stroke-width="2"/><text x="${X(p).toFixed(1)}" y="${(Y(p)+4).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0B1626" font-family="Rubik,sans-serif">${i+1}</text>`; });
  svg += `</svg>`;
  return `<div class="radar"><div class="lg"><span>${ic("bed")} ריבוע צהוב = המלון</span><span>צפון למעלה</span></div>${svg}</div>`;
}

    <button class="btn pri block" data-dobuild="1">${ic("wand")}בנה את היום</button>`);

function doBuild(){
  const sh = $("#sheet"), d = planDate(), r = regionForDate(d), b = baseForDate(r, d);
  const cats = [...sh.querySelectorAll("[data-ac][aria-pressed=true]")].flatMap(x=>x.dataset.ac.split(","));
  const rad = +sh.querySelector("[data-ar][aria-pressed=true]").dataset.ar, n = +sh.querySelector("[data-an][aria-pressed=true]").dataset.an;
  const food = sh.querySelector("[data-afood]").getAttribute("aria-pressed")==="true";
  const used = new Set(ST.plans[d]||[]);
  let pool = PL.filter(p => p.reg===r.k && !ST.vis[p.id] && !used.has(p.id) && km(b.lat,b.lon,p.lat,p.lon) <= rad);
  const nonFood = pool.filter(p => !isFood(p) && (!cats.length || p.cats.some(c=>cats.includes(c))));
  const score = p => (p.must?4:0) + (p.hs||0)*0.6 + (p.cats.includes("op")?1.5:0) - km(b.lat,b.lon,p.lat,p.lon)*0.25 + Math.random()*0.8;
  let pick = nonFood.sort((a,b2)=>score(b2)-score(a)).slice(0, food ? n-1 : n);
  if (food) {
    const cx = pick.length ? { lat: pick.reduce((s,p)=>s+p.lat,0)/pick.length, lon: pick.reduce((s,p)=>s+p.lon,0)/pick.length } : b;
    const f = pool.filter(p => isFood(p) && p.amit && !p.sea && p.dairy !== 2).sort((a,b2)=> (km(cx.lat,cx.lon,a.lat,a.lon)-(a.must?1:0)) - (km(cx.lat,cx.lon,b2.lat,b2.lon)-(b2.must?1:0)))[0];
    if (f) pick.push(f);
  }
  if (!pick.length) { toast("לא נמצאו מקומות מתאימים. הרחיבו מרחק"); return; }
  ST.plans[d] = nn([...(ST.plans[d]||[]), ...pick.map(p=>p.id)], b); save();
  closeSheet(); renderPlan(); toast("היום נבנה");
}

  let h = `<div class="sec-h"><h2>השמורים שלנו</h2><span>${favs.length} שמורים · ${visN} ביקרנו</span></div>`;
  if (!favs.length) h += `<div class="empty">עוד לא שמרתם מקומות.<br>לחצו על הלב בכרטיס כדי לשמור.</div>`;
  REGIONS.forEach(r => { const L = favs.filter(p => p.reg === r.k); if (!L.length) return; const b = baseForDate(r, r.from), o = {lat:b.lat,lon:b.lon};
    L.forEach(p=>p._d=distOf(p,o)); L.sort((a,b2)=>a._d-b2._d);
    h += `<div class="sec-h" style="margin-top:6px"><h2 style="font-size:16px">${r.he}</h2><span>${L.length}</span></div><div class="list">${L.map(p=>card(p,o,OPEN===p.id)).join("")}</div>`; });
  el.innerHTML = h;
}

/* ================= Cards (allergy + phrases) ================= */
const PHRASES = [
  ["乳製品は入っていますか？","Nyūseihin wa haitte imasu ka?","יש בזה מוצרי חלב?"],
  ["乳製品なしでお願いします。","Nyūseihin nashi de onegaishimasu.","בלי מוצרי חלב, בבקשה."],
  ["バターとチーズは抜いてください。","Batā to chīzu wa nuite kudasai.","בלי חמאה ובלי גבינה, בבקשה."],
  ["魚介類が苦手です。肉の料理はありますか？","Gyokairui ga nigate desu. Niku no ryōri wa arimasu ka?","אני לא אוכל פירות ים. יש מנה עם בשר?"],
  ["3人です。","San-nin desu.","אנחנו שלושה."],
  ["英語のメニューはありますか？","Eigo no menyū wa arimasu ka?","יש תפריט באנגלית?"],
  ["お会計お願いします。","O-kaikei onegaishimasu.","חשבון, בבקשה."],
  ["免税できますか？","Menzei dekimasu ka?","אפשר פטור ממס? (בחנויות, עם דרכון)"],
  ["ジャンク品を試してもいいですか？","Janku-hin o tameshite mo ii desu ka?","אפשר לבדוק את מוצר ה-Junk? (ב-Hard Off)"],
  ["ここに行きたいです。","Koko ni ikitai desu.","אני רוצה להגיע לכאן. (להראות מפה)"]
];
function renderCards(){
  $("#view-cards").innerHTML = `<div class="sec-h"><h2>כרטיס "בלי פירות ים"</h2><span>להראות למלצר</span></div>
    <button class="ph" data-big="jp" data-jp="私は魚介類（魚・エビ・イカ・タコ・貝）が食べられません。肉の料理をお願いします。" style="text-align:right;width:100%"><div class="jp">私は魚介類（魚・エビ・イカ・タコ・貝）が食べられません。肉の料理をお願いします。</div><div class="he">אני לא אוכל פירות ים: דגים, שרימפס, דיונון, תמנון וצדפות. אשמח למנה עם בשר.</div></button>
    <div class="sec-h"><h2>משפטים שימושיים</h2><span>לחצו להגדלה</span></div>
    <div class="phr">${PHRASES.map(p=>`<button class="ph" data-big="jp" data-jp="${esc(p[0])}" style="text-align:right;width:100%"><div class="jp">${esc(p[0])}</div><div class="ro">${esc(p[1])}</div><div class="he">${esc(p[2])}</div></button>`).join("")}</div>
    <div class="foot">${PL.length} מקומות במאגר · הנתונים נשמרים בטלפון</div>`;
}

/* ================= Sheets ================= */
function openSheet(html){ $("#sheet").innerHTML = `<div class="grab"></div>` + html; $("#sheet").classList.add("show"); $("#sheetBg").classList.add("show"); }
function closeSheet(){ $("#sheet").classList.remove("show"); $("#sheetBg").classList.remove("show"); }
function filterSheet(){
  const t = ST.tog;
  const tg = (k, l) => `<button class="chip tog" data-tog="${k}" aria-pressed="${!!t[k]}">${l}</button>`;
  openSheet(`<h3>סינון ומיון</h3>
    <div class="fgrp"><b>הצג רק</b><div class="chips">${tg("must","מקומות חובה")}${tg("hidevis","שעוד לא ביקרנו")}</div></div>
    <div class="fgrp"><b>מרחק ${origin().me?"ממך":"מהמלון"}</b><div class="chips">${tg("near","ברגל, עד 20 דק׳")}${tg("mid","עד 8 ק״מ")}</div></div>
    <div class="fgrp"><b>אוכל</b><div class="chips">${tg("amit","בלי פירות ים")}${tg("omri","בלי חלב (או לשאול)")}</div></div>
    <div class="fgrp"><b>מיון</b><div class="chips">${[["dist","הכי קרוב"],["must","מומלצים קודם"],["hs","דירוג Hard Off"],["name","לפי שם"]].map(([k,l])=>`<button class="chip tog" data-sort="${k}" aria-pressed="${ST.sort===k}">${l}</button>`).join("")}</div></div>
    <div class="fgrp"><b>מיקום</b><div class="chips"><button class="chip tog" data-useloc="1" aria-pressed="${ST.useLoc && !!GEO}">לחשב מרחקים מהמיקום שלי</button></div></div>
    <div class="row"><button class="btn block" data-reset="1">איפוס</button><button class="btn pri block" data-close="1">הצג תוצאות</button></div>`);
}

/* ================= Tabs / render ================= */
let TAB = "explore";
function renderTabs(){
  const pc = (ST.plans[planDate()]||[]).length, fc = Object.keys(ST.fav).length;
  const T = { explore:["compass","גילוי"], plan:["cal","התוכנית",pc], saved:["heart","שמורים",fc], cards:["card","כרטיסים"] };
  document.querySelectorAll(".tabs button").forEach(b => { const [i,l,c] = T[b.dataset.tab]; b.innerHTML = ic(i) + l + (c ? `<span class="cnt">${c}</span>` : ""); b.setAttribute("aria-selected", String(b.dataset.tab === TAB)); });
  ["explore","plan","saved","cards"].forEach(k => $("#view-"+k).hidden = k !== TAB);
  $("#bar").hidden = TAB !== "explore";
}
function renderAll(){
  renderHeader(); catChips(); renderTabs();
  if (TAB === "explore") renderExplore(); else if (TAB === "plan") renderPlan(); else if (TAB === "saved") renderSaved(); else renderCards();
}

/* ================= Events ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("button,a,g[data-rsel]"); if (!t) return;
  const ds = t.dataset;
  if (ds.reg) { ST.reg = ds.reg; regionManual = true; ST.cats = []; ST.grp = ""; OPEN = null; RSEL = null; LIMIT = 60; save(); renderAll(); window.scrollTo({top:0}); return; }
  if (ds.grp !== undefined) { ST.grp = ST.grp === ds.grp ? "" : ds.grp; ST.cats = []; LIMIT = 60; save(); catChips(); renderExplore(); return; }
  if (ds.cat !== undefined) { if (!ds.cat) ST.cats = []; else { const s = new Set(ST.cats); s.has(ds.cat) ? s.delete(ds.cat) : s.add(ds.cat); ST.cats = [...s]; } LIMIT = 60; save(); catChips(); renderExplore(); return; }
  if (ds.area !== undefined) { ST.area[curRegion().k] = ds.area; save(); renderExplore(); return; }
  if (ds.base) { ST.base[curRegion().k] = ds.base; save(); renderExplore(); return; }
  if (ds.open) { OPEN = OPEN === ds.open ? null : ds.open; const p = BYID[ds.open]; const el = document.getElementById("c-"+ds.open); if (el) el.outerHTML = card(p, origin(), OPEN === ds.open); return; }
  if (ds.fav) { ST.fav[ds.fav] ? delete ST.fav[ds.fav] : ST.fav[ds.fav] = 1; save(); toast(ST.fav[ds.fav] ? "נשמר" : "הוסר מהשמורים"); rerenderCard(ds.fav); renderTabs(); if (TAB==="saved") renderSaved(); return; }
  if (ds.vis) { ST.vis[ds.vis] ? delete ST.vis[ds.vis] : ST.vis[ds.vis] = 1; save(); rerenderCard(ds.vis); return; }
  if (ds.plan) { const d = planDate(), L = ST.plans[d] || (ST.plans[d] = []); const i = L.indexOf(ds.plan); if (i >= 0) { L.splice(i,1); toast("הוסר מהתוכנית"); } else { L.push(ds.plan); toast("נוסף לתוכנית של " + dShort(d)); } save(); rerenderCard(ds.plan); renderTabs(); return; }
  if (ds.more) { LIMIT += 60; renderExplore(); return; }
  if (ds.jump) { const p = BYID[ds.jump]; ST.view = "list"; OPEN = p.id; ST.area[curRegion().k] = ""; ST.cats = []; ST.grp = ""; $("#q").value = ""; save(); catChips(); const list = filtered(); const idx = list.findIndex(x=>x.id===p.id); if (idx >= LIMIT) LIMIT = idx + 10; renderExplore(); requestAnimationFrame(()=>{ const el = document.getElementById("c-"+p.id); if (el) el.scrollIntoView({behavior:"smooth",block:"center"}); }); return; }
  if (ds.rsel) { RSEL = ds.rsel; renderExplore(); return; }
  if (t.id === "viewBtn") { ST.view = ST.view === "radar" ? "list" : "radar"; save(); catChips(); renderExplore(); return; }
  if (t.id === "fltBtn") { filterSheet(); return; }
  if (ds.tog) { ST.tog[ds.tog] = !ST.tog[ds.tog]; if (ds.tog==="near"&&ST.tog.near) ST.tog.mid=false; if (ds.tog==="mid"&&ST.tog.mid) ST.tog.near=false; save(); filterSheet(); catChips(); renderExplore(); return; }
  if (ds.sort) { ST.sort = ds.sort; save(); filterSheet(); catChips(); renderExplore(); return; }
  if (ds.useloc) { if (ST.useLoc && GEO) { ST.useLoc = false; save(); filterSheet(); renderAll(); } else { locSheet(""); } return; }
  if (ds.gps) { askLoc(); return; }
  if (ds.here) { const p = BYID[ds.here]; setGeo({ lat:p.lat, lon:p.lon, manual:true, label:p.he }); toast("המרחקים מחושבים מ" + p.he); return; }
  if (ds.llpaste) { const inp = $("#llIn"); try { navigator.clipboard.readText().then(t => { inp.value = t; const g = parseLatLon(t); toast(g ? "הודבק. לחצו 'השתמש בנ.צ'" : "בלוח אין נ.צ"); }, () => { inp.focus(); toast("לחיצה ארוכה בשדה ואז 'הדבק'"); }); } catch(err) { inp.focus(); toast("לחיצה ארוכה בשדה ואז 'הדבק'"); } return; }
  if (ds.llset) { const g = parseLatLon($("#llIn").value); if (!g) { toast("לא זיהיתי קואורדינטות"); return; } setGeo({ ...g, manual:true, label:"הנקודה שהזנתם" }); toast("המיקום עודכן"); return; }
  if (ds.hotel) { GEO = null; ST.man = null; save(); closeSheet(); renderAll(); toast("המרחקים מהמלון"); return; }
  if (ds.reset) { ST.tog = {}; ST.sort = "dist"; ST.cats = []; ST.grp = ""; save(); closeSheet(); renderAll(); return; }
  if (ds.close) { closeSheet(); return; }
  if (ds.tab) { TAB = ds.tab; OPEN = null; renderAll(); window.scrollTo({top:0}); return; }
  if (ds.mv) { const [id, dir] = ds.mv.split("|"), L = ST.plans[planDate()], i = L.indexOf(id), j = i + +dir; if (j>=0 && j<L.length) { [L[i],L[j]]=[L[j],L[i]]; save(); renderPlan(); } return; }
  if (ds.rm) { const L = ST.plans[planDate()]; L.splice(L.indexOf(ds.rm),1); save(); renderPlan(); renderTabs(); return; }
  if (ds.opt) { const d = planDate(); ST.plans[d] = nn(ST.plans[d], planOrigin(d)); save(); renderPlan(); toast("המסלול סודר"); return; }
  if (ds.clear) { ST.plans[planDate()] = []; save(); renderPlan(); renderTabs(); return; }
  if (ds.auto) { autoSheet(); return; }
  if (ds.ac) { t.setAttribute("aria-pressed", String(t.getAttribute("aria-pressed")!=="true")); return; }
  if (ds.ar || ds.an) { const k = ds.ar ? "ar" : "an"; t.parentElement.querySelectorAll(`[data-${k}]`).forEach(x=>x.setAttribute("aria-pressed", String(x===t))); return; }
  if (ds.afood) { t.setAttribute("aria-pressed", String(t.getAttribute("aria-pressed")!=="true")); return; }
  if (ds.dobuild) { doBuild(); return; }
  if (ds.copyplan) { const d = planDate(), L = ST.plans[d].map(i=>BYID[i]); const txt = `התוכנית ל${dLong(d)} (${regionForDate(d).he}):\n` + L.map((p,i)=>`${i+1}. ${p.en} - ${p.he}\n${mapsUrl(p)}`).join("\n"); try { navigator.clipboard.writeText(txt).then(()=>toast("הועתק. אפשר להדביק בוואטסאפ"),()=>toast("לא הצלחתי להעתיק")); } catch(err) { toast("לא הצלחתי להעתיק"); } return; }
  if (ds.big) { const div = document.createElement("div"); div.className = "big"; div.innerHTML = ds.big === "img" ? `<img src="${CARD_IMG}" alt="">` : `<div class="jpbig">${esc(ds.jp)}</div>`; div.onclick = () => div.remove(); document.body.appendChild(div); return; }
});
function rerenderCard(id){ const el = document.getElementById("c-"+id); if (!el) return; const p = BYID[id], o = TAB==="saved" ? (()=>{const r=REGIONS.find(r=>r.k===p.reg), b=baseForDate(r,r.from); return {lat:b.lat,lon:b.lon};})() : origin(); el.outerHTML = card(p, o, OPEN === id); }
$("#sheetBg").onclick = closeSheet;
document.addEventListener("change", e => { if (e.target.id === "pdate") { PLAN_DATE = e.target.value; renderPlan(); renderTabs(); } });
let qT; $("#q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { LIMIT = 60; renderExplore(); }, 150); });

/* ================= Boot ================= */
if (!ST.reg || (regionForDate(now().date).k !== ST.reg && now().date >= regionForDate(now().date).from)) ST.reg = regionForDate(now().date).k;
renderAll();
setInterval(() => renderHeader(), 30000);
if (ST.man && Date.now() - ST.man.t < 6 * 3600e3) { GEO = ST.man; const near = regionNearGeo(); if (near) ST.reg = near.k; renderAll(); }
else if (ST.useLoc && navigator.geolocation && window.isSecureContext) {
  try {
    navigator.geolocation.getCurrentPosition(pos => { GEO = { lat:pos.coords.latitude, lon:pos.coords.longitude }; const near = regionNearGeo(); if (near) ST.reg = near.k; renderAll(); }, () => {}, { enableHighAccuracy:true, timeout:10000, maximumAge:300000 });
    navigator.geolocation.watchPosition(pos => { const g = { lat:pos.coords.latitude, lon:pos.coords.longitude }; if (!GEO || km(GEO.lat,GEO.lon,g.lat,g.lon) > 0.15) { GEO = g; if (TAB==="explore" && !OPEN) { renderHeader(); renderExplore(); } } }, () => {}, { enableHighAccuracy:false, maximumAge:60000 });
  } catch(e) {}
}
</script>
